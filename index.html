<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speedrun Leaderboards</title>

  <style>
    :root {
      --red: #ff3b3b;
      --orange: #ff7a18;
      --purple: #7c3aed;
      --dark: #0b0f1a;
      --panel: rgba(10, 15, 30, 0.85);
      --border: rgba(255,255,255,0.15);
      --text: #f5f7ff;
      --muted: #9aa6c0;
      --gold: #ffd700;
      --silver: #c0c0c0;
      --bronze: #cd7f32;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);

      background:
        linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.85)),
        url('background.jpg') center / cover no-repeat fixed;
    }

    .container {
      width: min(1300px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 40px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 42px;
      background: linear-gradient(90deg, var(--red), var(--orange));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 20px;
    }

    .layout {
      display: grid;
      grid-template-columns: 1.3fr 0.9fr;
      gap: 20px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      backdrop-filter: blur(6px);
      overflow: hidden;
    }

    .panel-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .tabs {
      display: flex;
      gap: 10px;
      padding: 10px 16px;
    }

    .tab {
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      cursor: pointer;
      font-weight: bold;
    }

    .tab.active {
      background: linear-gradient(135deg, var(--red), var(--purple));
      border: none;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    th {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
    }

    tr:hover td {
      background: rgba(255,255,255,0.05);
    }

    .rank.rank-1 { color: var(--gold); }
    .rank.rank-2 { color: var(--silver); }
    .rank.rank-3 { color: var(--bronze); }

    .player-link {
      color: var(--orange);
      cursor: pointer;
      font-weight: bold;
    }

    .video-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      backdrop-filter: blur(6px);
    }

    .video-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .video-frame {
      width: 100%;
      aspect-ratio: 16/9;
      border: 0;
      background: black;
    }

    .placeholder {
      padding: 40px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 1000px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Grand Chase Leaderboards</h1>
    <div class="subtitle">Speedrun rankings • Click a player to watch the run</div>

    <div class="layout">
      <div class="panel">
        <div class="panel-header" id="title"></div>
        <div class="tabs" id="tabs"></div>
        <div id="table"></div>
      </div>

      <div class="video-panel">
        <div class="video-header">
          <div id="videoTitle">Select a run</div>
        </div>
        <div id="videoArea" class="placeholder">No video selected</div>
      </div>
    </div>
  </div>

<script>
const DUNGEONS = {
  "Void Invasion": "v1.csv",
  "Void Taint": "v2.csv",
  "Void Nightmare": "v3.csv",
  "Tower of Disappearance": "tod.csv"
};

let state = { active: Object.keys(DUNGEONS)[0], data: {}, video:null };

function parseTSV(text){
  const [header,...lines]=text.trim().split("\n");
  const keys=header.split("\t");
  return lines.map(l=>{
    const v=l.split("\t");
    let o={}; keys.forEach((k,i)=>o[k]=v[i]); return o;
  });
}

function seconds(t){
  let p=t.split(":").map(Number);
  return p[0]*60+p[1];
}

function yt(url){
  let id=url.split("v=")[1]?.split("&")[0]||url.split("/").pop();
  return `https://www.youtube.com/embed/${id}`;
}

function renderTabs(){
  tabs.innerHTML="";
  Object.keys(DUNGEONS).forEach(d=>{
    let el=document.createElement("div");
    el.className="tab "+(state.active===d?"active":"");
    el.textContent=d;
    el.onclick=()=>{state.active=d;render();};
    tabs.appendChild(el);
  });
}

function render(){
  title.textContent=state.active;
  let rows=state.data[state.active]||[];

  table.innerHTML=`<table><thead><tr>
    <th>Pos</th><th>Character</th><th>Player</th><th>Time</th>
  </tr></thead><tbody>
  ${rows.map(r=>`
    <tr>
      <td class="rank rank-${r.Position}">${r.Position}</td>
      <td>${r.Character}</td>
      <td><span class="player-link" onclick="play('${r['Speedrun video:']}','${r.Player}')">${r.Player}</span></td>
      <td>${r.Time}</td>
    </tr>
  `).join('')}
  </tbody></table>`;

  renderTabs();
}

function play(url,player){
  videoTitle.textContent=player;
  videoArea.innerHTML=`<iframe class="video-frame" src="${yt(url)}" allowfullscreen></iframe>`;
}

async function load(){
  for(let d in DUNGEONS){
    let r=await fetch(DUNGEONS[d]);
    let t=await r.text();
    state.data[d]=parseTSV(t)
      .filter(x=>x.Player)
      .sort((a,b)=>seconds(a.Time)-seconds(b.Time));
  }
  render();
}

load();
</script>
</body>
</html>
