<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speedrun Leaderboards</title>

  <style>
    :root {
      --red: #ff3b3b;
      --orange: #ff7a18;
      --purple: #7c3aed;
      --panel: rgba(10, 15, 30, 0.86);
      --border: rgba(255,255,255,0.15);
      --text: #f5f7ff;
      --muted: #9aa6c0;
      --gold: #ffd700;
      --silver: #c0c0c0;
      --bronze: #cd7f32;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Trebuchet MS", Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.85)),
        url('background.jpg') center / cover no-repeat fixed;
    }

    .container {
      width: min(1450px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 40px;
    }

    h1 {
      margin: 0 0 10px;
      font-family: "Impact", "Arial Black", sans-serif;
      font-size: 48px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--red), var(--orange));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow:
        0 0 10px rgba(255, 122, 24, 0.35),
        0 0 24px rgba(255, 59, 59, 0.22),
        2px 2px 0 rgba(0,0,0,0.35);
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 20px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(760px, 1.22fr) minmax(500px, 0.9fr);
      gap: 18px;
      align-items: start;
    }

    .panel,
    .video-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      backdrop-filter: blur(6px);
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0,0,0,0.28);
    }

    .panel-header,
    .video-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .header-title {
      font-size: 24px;
      font-weight: 700;
    }

    .header-meta {
      color: var(--muted);
      font-size: 14px;
      margin-top: 4px;
    }

    .top-three {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      padding: 14px 16px 4px;
    }

    .top-card {
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 12px;
      background: rgba(255,255,255,0.04);
      min-width: 0;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .top-card.first {
      background: linear-gradient(135deg, rgba(255,215,0,0.18), rgba(255,122,24,0.12));
      border-color: rgba(255,215,0,0.3);
    }

    .top-card.second {
      background: linear-gradient(135deg, rgba(192,192,192,0.14), rgba(124,58,237,0.10));
      border-color: rgba(192,192,192,0.25);
    }

    .top-card.third {
      background: linear-gradient(135deg, rgba(205,127,50,0.18), rgba(255,59,59,0.10));
      border-color: rgba(205,127,50,0.25);
    }

    .top-card:hover {
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 0 18px rgba(255, 122, 24, 0.16);
      border-color: rgba(255,255,255,0.24);
    }

    .top-rank {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .top-main {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .top-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      object-fit: cover;
      flex: 0 0 auto;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.06);
    }

    .top-name-wrap {
      min-width: 0;
    }

    .top-character {
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .top-player {
      color: var(--orange);
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .top-time {
      margin-top: 8px;
      font-size: 18px;
      font-weight: 800;
    }

    .tabs {
      display: flex;
      gap: 10px;
      padding: 10px 16px;
      flex-wrap: wrap;
    }

    .tab {
      padding: 8px 14px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.04));
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.10), 0 0 0 rgba(0,0,0,0);
      cursor: pointer;
      font-weight: bold;
      color: var(--text);
      transition: 0.15s ease;
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .tab:hover {
      transform: translateY(-1px) scale(1.02);
      border-color: rgba(255,255,255,0.32);
      box-shadow: inset 0 0 12px rgba(255,255,255,0.06), 0 0 18px rgba(124, 58, 237, 0.18);
    }

    .tab.active {
      background: linear-gradient(135deg, var(--red), var(--purple));
      color: #ffffff;
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: inset 0 0 14px rgba(255,255,255,0.08), 0 0 20px rgba(255, 122, 24, 0.22);
    }

    .tab-spinner {
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    .tab.loading .tab-spinner {
      display: inline-block;
    }

    .table-wrap {
      padding: 0 12px 12px;
      overflow-x: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    col.col-pos { width: 72px; }
    col.col-character { width: 40%; }
    col.col-player { width: 24%; }
    col.col-time { width: 14%; }
    col.col-date { width: 18%; }

    th, td {
      padding: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      vertical-align: middle;
    }

    th {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      text-align: left;
      white-space: nowrap;
    }

    td {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    tbody tr {
      cursor: pointer;
      transition: background 0.15s ease;
    }

    tbody tr:hover td {
      background: rgba(255,255,255,0.06);
    }

    tbody tr.active-row td {
      background: rgba(124, 58, 237, 0.18);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.03), inset 0 -1px 0 rgba(255,255,255,0.03);
    }

    .rank {
      font-weight: 800;
    }

    .rank.rank-1 { color: var(--gold); }
    .rank.rank-2 { color: var(--silver); }
    .rank.rank-3 { color: var(--bronze); }

    .character-cell,
    .video-card-main {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .character-icon,
    .video-card-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.05);
      flex: 0 0 auto;
    }

    .video-card-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
    }

    .character-name,
    .video-card-text {
      font-weight: 700;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-name,
    .video-card-player {
      color: var(--orange);
      font-weight: 700;
    }

    .video-header-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .video-subtitle {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
    }

    .video-card {
      padding: 14px 16px 0;
    }

    .video-card-sub {
      color: var(--muted);
      font-size: 14px;
      margin-top: 6px;
    }

    .video-frame-wrap {
      padding: 16px;
    }

    .video-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 400px;
      border: 0;
      background: black;
      display: block;
      border-radius: 12px;
    }

    .video-extra {
      padding: 0 16px 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .video-actions {
      display: flex;
      gap: 10px;
      padding: 0 16px 14px;
      flex-wrap: wrap;
    }

    .action-btn {
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      border-radius: 10px;
      padding: 9px 12px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .action-btn:hover {
      background: rgba(255,255,255,0.09);
    }

    .placeholder {
      padding: 48px 24px;
      text-align: center;
      color: var(--muted);
      min-height: 440px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .empty {
      padding: 18px 16px 22px;
      color: var(--muted);
    }

    .loading-shell {
      padding: 12px 12px 18px;
    }

    .skeleton-row {
      display: grid;
      grid-template-columns: 72px 40% 24% 14% 18%;
      gap: 12px;
      padding: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .skeleton-block,
    .video-skeleton {
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(255,255,255,0.06), rgba(255,255,255,0.14), rgba(255,255,255,0.06));
      background-size: 200% 100%;
      animation: shimmer 1.2s linear infinite;
    }

    .skeleton-block {
      height: 18px;
    }

    .video-loading {
      padding: 16px;
    }

    .video-skeleton {
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 400px;
      border-radius: 12px;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @media (max-width: 1200px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .top-three {
        grid-template-columns: 1fr;
      }

      .video-frame,
      .video-skeleton {
        min-height: 360px;
      }

      .placeholder {
        min-height: 260px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Grand Chase Leaderboards</h1>
    <div class="subtitle">Speedrun rankings • Click any row to watch the run</div>

    <div class="layout">
      <div class="panel">
        <div class="panel-header">
          <div class="header-title" id="title"></div>
          <div class="header-meta" id="headerMeta"></div>
        </div>

        <div id="topThree"></div>
        <div class="tabs" id="tabs"></div>
        <div id="table"></div>
      </div>

      <div class="video-panel">
        <div class="video-header">
          <div class="video-header-title" id="videoTitle">Select a run</div>
          <div class="video-subtitle" id="videoSubtitle">Choose any leaderboard row to embed the video here.</div>
        </div>
        <div id="videoCard"></div>
        <div id="videoArea" class="placeholder">No video selected</div>
        <div class="video-actions" id="videoActions" style="display:none;">
          <a class="action-btn" id="youtubeButton" target="_blank" rel="noopener noreferrer">Open on YouTube</a>
          <button class="action-btn" id="copyButton" type="button">Copy video link</button>
        </div>
        <div class="video-extra" id="videoExtra"></div>
      </div>
    </div>
  </div>

<script>
const DUNGEONS = {
  "Void Invasion": "https://docs.google.com/spreadsheets/d/e/2PACX-1vSg2rhuWbyxU6gWk79L54s3CoBLWuDUgrhxkaBZ2fnzOzdMEE48iuHff3O9z1NZBOiYR8f8dkMHHdnd/pub?gid=1827141351&single=true&output=csv",
  "Void Taint": "https://docs.google.com/spreadsheets/d/e/2PACX-1vSg2rhuWbyxU6gWk79L54s3CoBLWuDUgrhxkaBZ2fnzOzdMEE48iuHff3O9z1NZBOiYR8f8dkMHHdnd/pub?gid=1202569298&single=true&output=csv",
  "Void Nightmare": "https://docs.google.com/spreadsheets/d/e/2PACX-1vSg2rhuWbyxU6gWk79L54s3CoBLWuDUgrhxkaBZ2fnzOzdMEE48iuHff3O9z1NZBOiYR8f8dkMHHdnd/pub?gid=288867483&single=true&output=csv",
  "Tower of Disappearance": "https://docs.google.com/spreadsheets/d/e/2PACX-1vSg2rhuWbyxU6gWk79L54s3CoBLWuDUgrhxkaBZ2fnzOzdMEE48iuHff3O9z1NZBOiYR8f8dkMHHdnd/pub?gid=1230006600&single=true&output=csv"
};

const dungeonOrder = Object.keys(DUNGEONS);

let state = {
  active: "Void Invasion",
  data: {},
  selected: null,
  loadingDungeon: false,
  loadingTabs: new Set()
};

const titleEl = document.getElementById("title");
const headerMetaEl = document.getElementById("headerMeta");
const topThreeEl = document.getElementById("topThree");
const tableEl = document.getElementById("table");
const tabsEl = document.getElementById("tabs");
const videoTitleEl = document.getElementById("videoTitle");
const videoSubtitleEl = document.getElementById("videoSubtitle");
const videoCardEl = document.getElementById("videoCard");
const videoAreaEl = document.getElementById("videoArea");
const videoActionsEl = document.getElementById("videoActions");
const youtubeButtonEl = document.getElementById("youtubeButton");
const copyButtonEl = document.getElementById("copyButton");
const videoExtraEl = document.getElementById("videoExtra");
let lastRefreshText = "";

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function parseDelimitedLine(line, delimiter) {
  const values = [];
  let current = "";
  let inQuotes = false;

  for (let i = 0; i < line.length; i++) {
    const char = line[i];
    const next = line[i + 1];

    if (char === '"') {
      if (inQuotes && next === '"') {
        current += '"';
        i++;
      } else {
        inQuotes = !inQuotes;
      }
    } else if (char === delimiter && !inQuotes) {
      values.push(current.trim());
      current = "";
    } else {
      current += char;
    }
  }

  values.push(current.trim());
  return values;
}

function parseSheetData(text) {
  const lines = text
    .replace(/\r/g, "")
    .split("\n")
    .filter(line => line.trim() !== "");

  if (!lines.length) return [];

  const headerIndex = lines.findIndex(line =>
    line.toLowerCase().includes("position") &&
    line.toLowerCase().includes("character")
  );

  if (headerIndex === -1) return [];

  const delimiter = lines[headerIndex].includes("\t") ? "\t" : ",";
  const keys = parseDelimitedLine(lines[headerIndex], delimiter);

  return lines.slice(headerIndex + 1).map(line => {
    const values = parseDelimitedLine(line, delimiter);
    const obj = {};
    keys.forEach((k, i) => {
      obj[k] = (values[i] ?? "").trim();
    });
    return obj;
  });
}

function seconds(t) {
  const parts = String(t || "").split(":").map(Number);
  if (parts.length === 2 && !parts.some(Number.isNaN)) return parts[0] * 60 + parts[1];
  if (parts.length === 3 && !parts.some(Number.isNaN)) return parts[0] * 3600 + parts[1] * 60 + parts[2];
  return Number.POSITIVE_INFINITY;
}

function yt(url) {
  try {
    const parsed = new URL(url);
    if (parsed.hostname.includes("youtu.be")) {
      const id = parsed.pathname.replace("/", "").trim();
      return id ? `https://www.youtube.com/embed/${id}` : "";
    }
    if (parsed.hostname.includes("youtube.com")) {
      const id = parsed.searchParams.get("v");
      return id ? `https://www.youtube.com/embed/${id}` : "";
    }
  } catch (e) {}
  return "";
}

function normalizeCharacterName(rawName) {
  return String(rawName || "").replace(/^\d+\)\s*/, "").trim();
}

function iconFileFromCharacter(rawName) {
  const name = normalizeCharacterName(rawName)
    .toLowerCase()
    .replace(/\//g, "-")
    .replace(/\s+/g, "-")
    .replace(/[^a-z0-9-]/g, "");
  return name ? `${name}.jpg` : "";
}

function positionValue(position) {
  const n = parseInt(position, 10);
  return Number.isFinite(n) ? n : 999999;
}

function enrichRows(rows) {
  return rows
    .map(row => ({
      ...row,
      cleanCharacter: normalizeCharacterName(row.Character),
      iconFile: iconFileFromCharacter(row.Character),
      timeSeconds: seconds(row.Time)
    }))
    .sort((a, b) => {
      const timeDiff = a.timeSeconds - b.timeSeconds;
      if (timeDiff !== 0) return timeDiff;
      const posDiff = positionValue(a.Position) - positionValue(b.Position);
      if (posDiff !== 0) return posDiff;
      return a.cleanCharacter.localeCompare(b.cleanCharacter);
    });
}

function makeRowKey(row) {
  return [
    row.Position,
    row.cleanCharacter,
    row.Player,
    row.Time,
    row["Post date (dd/mm/yyyy)"] || ""
  ].join("|");
}

function getDisplayedRows() {
  return state.data[state.active] || [];
}

function selectRow(row) {
  state.selected = row ? { dungeon: state.active, rowKey: makeRowKey(row), row } : null;
  render();
  renderVideo();
  const selectedRow = tableEl.querySelector("tbody tr.active-row");
  if (selectedRow) {
    selectedRow.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
}

function renderTabs() {
  tabsEl.innerHTML = "";
  Object.keys(DUNGEONS).forEach(dungeon => {
    const el = document.createElement("button");
    el.className = "tab " + (state.active === dungeon ? "active" : "") + (state.loadingTabs.has(dungeon) ? " loading" : "");
    el.type = "button";
    el.innerHTML = `<span>${escapeHtml(dungeon)}</span><span class="tab-spinner"></span>`;
    el.onclick = async () => {
      state.active = dungeon;
      state.selected = null;

      if (!state.data[dungeon]) {
        state.loadingDungeon = true;
        state.loadingTabs.add(dungeon);
        render();
        renderVideo();
        await loadDungeon(dungeon);
        state.loadingTabs.delete(dungeon);
        state.loadingDungeon = false;
      }

      render();
      renderVideo();
    };
    tabsEl.appendChild(el);
  });
}

function renderTopThree(rows) {
  const top = rows.slice(0, 3);
  if (!top.length) {
    topThreeEl.innerHTML = "";
    return;
  }

  const classes = ["first", "second", "third"];
  topThreeEl.className = "top-three";
  topThreeEl.innerHTML = top.map((row, index) => `
    <div class="top-card ${classes[index] || ""}" data-row-key="${escapeHtml(makeRowKey(row))}">
      <div class="top-rank">Top ${index + 1}</div>
      <div class="top-main">
        <img class="top-icon" src="${escapeHtml(row.iconFile)}" alt="${escapeHtml(row.cleanCharacter)}" onerror="this.style.display='none'">
        <div class="top-name-wrap">
          <div class="top-character">${escapeHtml(row.cleanCharacter)}</div>
          <div class="top-player">${escapeHtml(row.Player)}</div>
        </div>
      </div>
      <div class="top-time">${escapeHtml(row.Time)}</div>
    </div>
  `).join("");

  topThreeEl.querySelectorAll('.top-card').forEach(card => {
    card.addEventListener('click', () => {
      const rowKey = card.getAttribute('data-row-key');
      const row = rows.find(item => makeRowKey(item) === rowKey);
      selectRow(row);
    });
  });
}

function render() {
  titleEl.textContent = state.active;

  const rows = getDisplayedRows();
  headerMetaEl.textContent = `${rows.length} total${lastRefreshText ? ` • ${lastRefreshText}` : ""}`;
  renderTopThree(rows);

  if (state.loadingDungeon && !rows.length) {
    tableEl.innerHTML = `
      <div class="loading-shell">
        ${Array.from({ length: 8 }).map(() => `
          <div class="skeleton-row">
            <div class="skeleton-block"></div>
            <div class="skeleton-block"></div>
            <div class="skeleton-block"></div>
            <div class="skeleton-block"></div>
            <div class="skeleton-block"></div>
          </div>
        `).join("")}
      </div>
    `;
    renderTabs();
    return;
  }

  if (!rows.length) {
    tableEl.innerHTML = `<div class="empty">No runs found for ${escapeHtml(state.active)}.</div>`;
    renderTabs();
    return;
  }

  tableEl.innerHTML = `
    <div class="table-wrap">
      <table>
        <colgroup>
          <col class="col-pos">
          <col class="col-character">
          <col class="col-player">
          <col class="col-time">
          <col class="col-date">
        </colgroup>
        <thead>
          <tr>
            <th>Pos</th>
            <th>Character</th>
            <th>Player</th>
            <th>Time</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(row => {
            const activeClass = state.selected && state.selected.dungeon === state.active && state.selected.rowKey === makeRowKey(row)
              ? "active-row"
              : "";

            const rankClass = row.Position === "1"
              ? "rank rank-1"
              : row.Position === "2"
              ? "rank rank-2"
              : row.Position === "3"
              ? "rank rank-3"
              : "rank";

            return `
              <tr class="${activeClass}" data-row-key="${escapeHtml(makeRowKey(row))}">
                <td class="${rankClass}">${escapeHtml(row.Position)}</td>
                <td>
                  <div class="character-cell">
                    <img class="character-icon" src="${escapeHtml(row.iconFile)}" alt="${escapeHtml(row.cleanCharacter)}" onerror="this.style.display='none'">
                    <span class="character-name">${escapeHtml(row.cleanCharacter)}</span>
                  </div>
                </td>
                <td><span class="player-name">${escapeHtml(row.Player)}</span></td>
                <td>${escapeHtml(row.Time)}</td>
                <td>${escapeHtml(row["Post date (dd/mm/yyyy)"] || "")}</td>
              </tr>
            `;
          }).join("")}
        </tbody>
      </table>
    </div>
  `;

  tableEl.querySelectorAll("tbody tr").forEach(tr => {
    tr.addEventListener("click", () => {
      const rowKey = tr.getAttribute("data-row-key");
      const row = rows.find(item => makeRowKey(item) === rowKey);
      selectRow(row);
    });
  });

  renderTabs();
}

function renderVideo() {
  if (state.loadingDungeon && !state.selected) {
    videoTitleEl.textContent = "Loading runs...";
    videoSubtitleEl.textContent = "Fetching leaderboard data from the sheet.";
    videoCardEl.innerHTML = "";
    videoAreaEl.className = "";
    videoAreaEl.innerHTML = `<div class="video-loading"><div class="video-skeleton"></div></div>`;
    videoActionsEl.style.display = "none";
    videoExtraEl.innerHTML = "";
    return;
  }

  if (!state.selected || !state.selected.row) {
    videoTitleEl.textContent = "Select a run";
    videoSubtitleEl.textContent = "Choose any leaderboard row to embed the video here.";
    videoCardEl.innerHTML = "";
    videoAreaEl.className = "placeholder";
    videoAreaEl.innerHTML = "No video selected";
    videoActionsEl.style.display = "none";
    videoExtraEl.innerHTML = "";
    return;
  }

  const row = state.selected.row;
  const embed = yt(row["Speedrun video:"]);

  videoTitleEl.textContent = `${row.Player} • ${row.cleanCharacter}`;
  videoSubtitleEl.textContent = `${state.selected.dungeon} • ${row.Time} • ${row["Post date (dd/mm/yyyy)"] || ""}`;

  videoCardEl.innerHTML = `
    <div class="video-card">
      <div class="video-card-main">
        <img class="video-card-icon" src="${escapeHtml(row.iconFile)}" alt="${escapeHtml(row.cleanCharacter)}" onerror="this.style.display='none'">
        <div class="video-card-text">
          <div>${escapeHtml(row.cleanCharacter)}</div>
          <div class="video-card-player">${escapeHtml(row.Player)}</div>
        </div>
      </div>
      <div class="video-card-sub">Position ${escapeHtml(row.Position)} • ${escapeHtml(row.Time)}</div>
    </div>
  `;

  if (!embed) {
    videoAreaEl.className = "placeholder";
    videoAreaEl.innerHTML = "Invalid or missing YouTube link";
    videoActionsEl.style.display = "none";
    videoExtraEl.innerHTML = "";
    return;
  }

  videoAreaEl.className = "";
  videoAreaEl.innerHTML = `
    <div class="video-frame-wrap">
      <iframe class="video-frame" src="${escapeHtml(embed)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    </div>
  `;

  youtubeButtonEl.href = row["Speedrun video:"];
  videoActionsEl.style.display = "flex";
  videoExtraEl.innerHTML = `Submitted on ${escapeHtml(row["Post date (dd/mm/yyyy)"] || "")}.`;
}

async function loadDungeon(dungeon) {
  try {
    const response = await fetch(DUNGEONS[dungeon], { cache: "no-store" });
    if (!response.ok) {
      state.data[dungeon] = [];
      return;
    }

    const text = await response.text();
    state.data[dungeon] = enrichRows(
      parseSheetData(text).filter(row =>
        row.Player &&
        row.Time &&
        row.Character &&
        row.Position &&
        row["Speedrun video:"]
      )
    );
  } catch (e) {
    state.data[dungeon] = [];
  }
}

function preloadRemainingDungeons() {
  dungeonOrder
    .filter(dungeon => dungeon !== state.active && !state.data[dungeon])
    .forEach(async dungeon => {
      state.loadingTabs.add(dungeon);
      renderTabs();
      await loadDungeon(dungeon);
      state.loadingTabs.delete(dungeon);
      renderTabs();
    });
}

async function load() {
  state.loadingDungeon = true;
  render();
  renderVideo();
  await loadDungeon(state.active);
  state.loadingDungeon = false;
  lastRefreshText = `updated ${new Date().toLocaleString()}`;
  render();
  renderVideo();
  preloadRemainingDungeons();
}

copyButtonEl.addEventListener("click", async () => {
  if (!state.selected || !state.selected.row) return;
  try {
    await navigator.clipboard.writeText(state.selected.row["Speedrun video:"] || "");
    copyButtonEl.textContent = "Copied";
    setTimeout(() => {
      copyButtonEl.textContent = "Copy video link";
    }, 1200);
  } catch (e) {
    copyButtonEl.textContent = "Copy failed";
    setTimeout(() => {
      copyButtonEl.textContent = "Copy video link";
    }, 1200);
  }
});

renderTabs();
load();
</script>
</body>
</html>
