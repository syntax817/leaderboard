<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grand Chase Leaderboards</title>
  <link rel="icon" type="image/webp" href="logo.webp" />

  <style>
    :root {
      --red: #ff3b3b;
      --orange: #ff7a18;
      --purple: #7c3aed;
      --panel: rgba(10, 15, 30, 0.86);
      --border: rgba(255,255,255,0.15);
      --text: #f5f7ff;
      --muted: #9aa6c0;
      --gold: #ffd700;
      --silver: #c0c0c0;
      --bronze: #cd7f32;
      --ss: #ffdf5d;
      --s: #ff9d3d;
      --a: #c96cff;
      --b: #5fa9ff;
      --c: #58d68d;
      --d: #c7d36f;
      --f: #9aa6c0;
      --na: #707784;
      --ok: #58d68d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Trebuchet MS", Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.85)),
        url('background.jpg') center / cover no-repeat fixed;
    }

    .container {
      width: min(1450px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 40px;
    }

    h1 {
      margin: 0 0 10px;
      font-family: "Impact", "Arial Black", sans-serif;
      font-size: 48px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--red), var(--orange));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow:
        0 0 10px rgba(255, 122, 24, 0.35),
        0 0 24px rgba(255, 59, 59, 0.22),
        2px 2px 0 rgba(0,0,0,0.35);
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 16px;
    }

    .view-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .view-tab,
    .tab,
    .mini-toggle {
      padding: 8px 14px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.04));
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.10), 0 0 0 rgba(0,0,0,0);
      cursor: pointer;
      font-weight: bold;
      color: var(--text);
      transition: 0.15s ease;
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .view-tab:hover,
    .tab:hover,
    .mini-toggle:hover {
      transform: translateY(-1px) scale(1.02);
      border-color: rgba(255,255,255,0.32);
      box-shadow: inset 0 0 12px rgba(255,255,255,0.06), 0 0 18px rgba(124, 58, 237, 0.18);
    }

    .view-tab.active,
    .tab.active,
    .mini-toggle.active {
      background: linear-gradient(135deg, var(--red), var(--purple));
      color: #ffffff;
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: inset 0 0 14px rgba(255,255,255,0.08), 0 0 20px rgba(255, 122, 24, 0.22);
    }

    .mini-toggle.off {
      opacity: 0.72;
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(760px, 1.22fr) minmax(500px, 0.9fr);
      gap: 18px;
      align-items: start;
    }

    .panel,
    .video-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      backdrop-filter: blur(6px);
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0,0,0,0.28);
    }

    .panel-header,
    .video-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .header-title {
      font-size: 24px;
      font-weight: 700;
    }

    .header-meta {
      color: var(--muted);
      font-size: 14px;
      margin-top: 4px;
      white-space: normal;
      word-break: break-word;
    }

    .top-three {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      padding: 14px 16px 4px;
    }

    .top-card {
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 12px;
      background: rgba(255,255,255,0.04);
      min-width: 0;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .top-card.first {
      background: linear-gradient(135deg, rgba(255,215,0,0.18), rgba(255,122,24,0.12));
      border-color: rgba(255,215,0,0.3);
    }

    .top-card.second {
      background: linear-gradient(135deg, rgba(192,192,192,0.14), rgba(124,58,237,0.10));
      border-color: rgba(192,192,192,0.25);
    }

    .top-card.third {
      background: linear-gradient(135deg, rgba(205,127,50,0.18), rgba(255,59,59,0.10));
      border-color: rgba(205,127,50,0.25);
    }

    .top-card:hover {
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 0 18px rgba(255, 122, 24, 0.16);
      border-color: rgba(255,255,255,0.24);
    }

    .top-rank {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .top-main,
    .character-cell,
    .video-card-main,
    .tier-card-main {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .top-icon,
    .character-icon,
    .video-card-icon,
    .tier-icon,
    .side-timeline-node img,
    .timeline-preview img {
      object-fit: cover;
      flex: 0 0 auto;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.06);
    }

    .top-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
    }

    .character-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
    }

    .video-card-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
    }

    .tier-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
    }

    .top-character,
    .character-name,
    .video-card-text,
    .tier-card-name {
      font-weight: 700;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .top-character {
      font-weight: 800;
    }

    .top-player,
    .player-name,
    .video-card-player,
    .tier-card-sub {
      color: var(--orange);
      font-weight: 700;
      font-size: 14px;
    }

    .top-time {
      margin-top: 8px;
      font-size: 18px;
      font-weight: 800;
    }

    .tabs {
      display: flex;
      gap: 10px;
      padding: 10px 16px;
      flex-wrap: wrap;
    }

    .tab-spinner {
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    .tab.loading .tab-spinner {
      display: inline-block;
    }

    .leaderboard-with-timeline {
      display: grid;
      grid-template-columns: 112px 1fr;
      gap: 0;
      align-items: start;
    }

    .side-timeline {
      position: relative;
      padding: 54px 0 12px;
      margin-left: 0;
    }

    .timeline-preview {
      position: sticky;
      top: 8px;
      left: 8px;
      width: 68px;
      min-height: 90px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.9);
      background: rgba(255,255,255,0.08);
      z-index: 5;
      display: none;
      box-shadow: 0 10px 24px rgba(0,0,0,0.28);
    }

    .timeline-preview.show {
      display: block;
    }

    .timeline-preview img {
      width: 100%;
      height: 68px;
      display: block;
      border: 0;
    }

    .timeline-preview-meta {
      padding: 6px 6px 7px;
      text-align: center;
      background: rgba(8,12,26,0.88);
    }

    .timeline-preview-name {
      font-size: 11px;
      font-weight: 800;
      line-height: 1.15;
      color: var(--text);
      white-space: normal;
      word-break: break-word;
    }

    .timeline-preview-time {
      font-size: 10px;
      font-weight: 700;
      color: var(--orange);
      margin-top: 3px;
      white-space: nowrap;
    }

    .side-timeline-line {
      position: absolute;
      left: 76px;
      width: 4px;
      border-radius: 999px;
      background: linear-gradient(180deg, #5ecbff, #19d3ff);
    }

    .side-timeline-marker {
      position: absolute;
      left: -35px;
      width: 90px;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      pointer-events: none;
    }

    .side-timeline-marker-label {
      font-size: 12px;
      font-weight: 800;
      color: #d8e6ff;
      white-space: nowrap;
    }

    .side-timeline-marker-tick {
      width: 10px;
      height: 2px;
      border-radius: 999px;
      background: rgba(255,255,255,.75);
    }

    .side-timeline-node {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid rgba(255,255,255,.92);
      background: rgba(255,255,255,.08);
      transition: transform .15s ease, box-shadow .15s ease;
      z-index: 2;
    }

    .side-timeline-node:hover {
      transform: translate(-50%, -50%) scale(1.06);
      box-shadow: 0 0 16px rgba(255,255,255,.18);
    }

    .side-timeline-node img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .side-timeline-node.active {
      box-shadow: 0 0 0 3px rgba(124,58,237,.35), 0 0 18px rgba(124,58,237,.35);
    }

    .table-wrap {
      padding: 0 12px 12px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    col.col-pos { width: 72px; }
    col.col-character { width: 32%; }
    col.col-player { width: 20%; }
    col.col-time { width: 12%; }
    col.col-date { width: 18%; }
    col.col-gap { width: 18%; }

    th, td {
      padding: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      vertical-align: middle;
    }

    th {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      text-align: left;
      white-space: nowrap;
    }

    td {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    tbody tr {
      cursor: pointer;
      transition: background 0.15s ease;
    }

    tbody tr:hover td {
      background: rgba(255,255,255,0.06);
    }

    tbody tr.active-row td {
      background: rgba(124, 58, 237, 0.18);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.03), inset 0 -1px 0 rgba(255,255,255,0.03);
    }

    .rank {
      font-weight: 800;
    }

    .rank.rank-1 { color: var(--gold); }
    .rank.rank-2 { color: var(--silver); }
    .rank.rank-3 { color: var(--bronze); }

    .delta.good { color: var(--ok); font-weight: 700; }
    .delta.neutral { color: var(--muted); }

    .video-stack {
      display: grid;
      gap: 16px;
    }

    .rules-panel {
      overflow: hidden;
    }

    .rules-area {
      padding: 14px 16px 18px;
    }

    .rules-list {
      margin: 0;
      padding-left: 18px;
      color: var(--text);
      line-height: 1.5;
    }

    .rules-list li {
      margin: 0 0 10px;
      word-break: break-word;
    }

    .rules-list li:last-child {
      margin-bottom: 0;
    }

    .video-header-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .video-subtitle {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
      white-space: normal;
      word-break: break-word;
    }

    .video-card {
      padding: 14px 16px 0;
    }

    .video-card-sub {
      color: var(--muted);
      font-size: 14px;
      margin-top: 6px;
      white-space: normal;
      word-break: break-word;
    }

    .video-frame-wrap {
      padding: 16px;
    }

    .video-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 400px;
      border: 0;
      background: black;
      display: block;
      border-radius: 12px;
    }

    .video-actions {
      display: flex;
      gap: 10px;
      padding: 0 16px 14px;
      flex-wrap: wrap;
    }

    .action-btn {
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      border-radius: 10px;
      padding: 9px 12px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .action-btn:hover {
      background: rgba(255,255,255,0.09);
    }

    .video-extra {
      padding: 0 16px 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      white-space: normal;
      word-break: break-word;
    }

    .multi-video-wrap {
      padding: 16px;
      display: grid;
      gap: 18px;
    }

    .multi-video-block {
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 12px;
      padding: 12px;
      background: rgba(255,255,255,0.03);
    }

    .multi-video-block h3 {
      margin: 0 0 8px;
      font-size: 18px;
      white-space: normal;
      word-break: break-word;
    }

    .multi-video-meta {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 10px;
      white-space: normal;
      word-break: break-word;
    }

    .multi-video-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      border-radius: 10px;
      background: black;
    }

    .multi-video-empty {
      color: var(--muted);
      padding: 14px 0;
      white-space: normal;
      word-break: break-word;
    }

    .tier-wrap {
      padding: 14px 16px 18px;
    }

    .tier-note {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 10px;
      white-space: normal;
      word-break: break-word;
    }

    .overall-controls {
      display: grid;
      gap: 10px;
      padding: 10px 0 14px;
    }

    .overall-controls-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .overall-controls-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      margin-right: 2px;
    }

    .tier-group {
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 14px;
      background: rgba(255,255,255,0.03);
    }

    .tier-header {
      display: grid;
      grid-template-columns: 94px 1fr;
      min-height: 72px;
    }

    .tier-label {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: #0b1020;
    }

    .tier-SS { background: var(--ss); }
    .tier-S { background: var(--s); }
    .tier-A { background: var(--a); }
    .tier-B { background: var(--b); }
    .tier-C { background: var(--c); }
    .tier-D { background: var(--d); }
    .tier-F { background: var(--f); }
    .tier-NA { background: var(--na); color: #fff; }

    .tier-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
      padding: 12px;
    }

    .tier-card {
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      padding: 10px;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .tier-card:hover {
      transform: translateY(-1px);
      border-color: rgba(255,255,255,0.22);
      box-shadow: 0 0 14px rgba(124,58,237,0.16);
    }

    .tier-card-score {
      color: var(--muted);
      font-size: 12px;
      margin-top: 6px;
      white-space: normal;
      line-height: 1.4;
      word-break: break-word;
    }

    .rank-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 12px;
      margin-top: 2px;
      color: var(--orange);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
      white-space: normal;
    }

    .rank-grid span {
      white-space: nowrap;
    }

    .loading-shell {
      padding: 12px 12px 18px;
    }

    .skeleton-row {
      display: grid;
      grid-template-columns: 72px 34% 22% 14% 14% 16%;
      gap: 12px;
      padding: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .skeleton-block,
    .video-skeleton {
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(255,255,255,0.06), rgba(255,255,255,0.14), rgba(255,255,255,0.06));
      background-size: 200% 100%;
      animation: shimmer 1.2s linear infinite;
    }

    .skeleton-block {
      height: 18px;
    }

    .video-loading {
      padding: 16px;
    }

    .video-skeleton {
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 400px;
      border-radius: 12px;
    }

    .empty,
    .placeholder {
      color: var(--muted);
    }

    .placeholder {
      padding: 48px 24px;
      min-height: 440px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .empty {
      padding: 18px 16px 22px;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @media (max-width: 900px) {
      .container {
        width: min(100%, calc(100% - 20px));
        padding: 14px 0 28px;
      }

      h1 {
        font-size: 32px;
        line-height: 1.05;
      }

      .subtitle {
        font-size: 14px;
      }

      .layout {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .top-three {
        grid-template-columns: 1fr;
      }

      .video-frame,
      .video-skeleton,
      .multi-video-frame {
        min-height: 220px;
      }

      .placeholder {
        min-height: 180px;
        padding: 24px 16px;
      }

      .tier-header {
        grid-template-columns: 70px 1fr;
      }

      .tier-label {
        font-size: 22px;
      }

      .tier-cards {
        grid-template-columns: 1fr;
      }

      .tabs,
      .view-tabs,
      .overall-controls-group {
        gap: 8px;
      }

      .tab,
      .view-tab,
      .mini-toggle {
        padding: 7px 11px;
        font-size: 13px;
      }

      table {
        table-layout: auto;
      }

      col.col-pos,
      col.col-character,
      col.col-player,
      col.col-time,
      col.col-date,
      col.col-gap {
        width: auto;
      }

      th,
      td {
        padding: 10px 8px;
        white-space: normal;
        overflow: visible;
        text-overflow: unset;
        word-break: break-word;
      }

      td:nth-child(1),
      td:nth-child(4),
      td:nth-child(6),
      th:nth-child(1),
      th:nth-child(4),
      th:nth-child(6) {
        white-space: nowrap;
      }

      .character-name,
      .player-name,
      .top-character,
      .top-player,
      .video-card-text,
      .video-card-player,
      .tier-card-name,
      .tier-card-sub {
        white-space: normal;
        overflow: visible;
        text-overflow: unset;
        word-break: break-word;
      }

      .rank-grid {
        grid-template-columns: 1fr;
        gap: 3px;
      }

      .rank-grid span {
        white-space: normal;
      }

      .rules-list {
        padding-left: 16px;
      }

      .overall-controls {
        gap: 8px;
      }

      .overall-controls-group {
        align-items: flex-start;
      }

      .overall-controls-label {
        width: 100%;
        margin-bottom: 2px;
      }

      .leaderboard-with-timeline {
        grid-template-columns: 120px 1fr;
      }

      .timeline-preview {
        width: 56px;
        min-height: 76px;
      }

      .timeline-preview img {
        height: 56px;
      }

      .timeline-preview-name {
        font-size: 9px;
      }

      .timeline-preview-time {
        font-size: 9px;
      }

      .side-timeline-line {
        left: 60px;
      }

      .side-timeline-node {
        width: 34px;
        height: 34px;
      }

      .side-timeline-marker {
        left: -15px;
        width: 90px;
        gap: 6px;
      }

      .side-timeline-marker-label {
        font-size: 10px;
      }

      .side-timeline-marker-tick {
        width: 8px;
      }
    }

    @media (max-width: 700px) {
      th:nth-child(6),
      td:nth-child(6) {
        display: none;
      }

      .multi-video-wrap,
      .video-frame-wrap,
      .rules-area,
      .tier-wrap {

      .multi-video-block {

      }

      .leaderboard-with-timeline {
        grid-template-columns: 1fr;
      }

      .side-timeline {
        display: none;
      }
    }

    @media (max-width: 560px) {
      th:nth-child(5),
      td:nth-child(5) {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Grand Chase Leaderboards</h1>
    <div class="subtitle">Speedrun rankings • Click any row, timeline icon, or tier card to watch the run</div>

    <div class="view-tabs">
      <button type="button" class="view-tab active" id="viewLeaderboard">Leaderboard</button>
      <button type="button" class="view-tab" id="viewTier">Tier List</button>
    </div>

    <div class="layout">
      <div class="panel">
        <div class="panel-header">
          <div class="header-title" id="title"></div>
          <div class="header-meta" id="headerMeta"></div>
        </div>
        <div id="contentArea"></div>
      </div>

      <div class="video-stack">
        <div class="video-panel rules-panel">
          <div class="video-header">
            <div class="video-header-title">Speedrun Rules</div>
            <div class="video-subtitle" id="rulesSubtitle">General rules for all dungeons</div>
          </div>
          <div id="rulesArea" class="rules-area"></div>
        </div>

        <div class="video-panel">
          <div class="video-header">
            <div class="video-header-title" id="videoTitle">Select a run</div>
            <div class="video-subtitle" id="videoSubtitle">Choose any leaderboard row, timeline icon, or tier card to embed the video here.</div>
          </div>
          <div id="videoCard"></div>
          <div id="videoArea" class="placeholder">No video selected</div>
          <div class="video-actions" id="videoActions" style="display:none;">
            <a class="action-btn" id="youtubeButton" target="_blank" rel="noopener noreferrer">Open on YouTube</a>
            <button class="action-btn" id="copyButton" type="button">Copy video link</button>
          </div>
          <div class="video-extra" id="videoExtra"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const DUNGEONS = {
      "Void Invasion": "https://docs.google.com/spreadsheets/d/e/2PACX-1vSg2rhuWbyxU6gWk79L54s3CoBLWuDUgrhxkaBZ2fnzOzdMEE48iuHff3O9z1NZBOiYR8f8dkMHHdnd/pub?gid=1827141351&single=true&output=csv",
      "Void Taint": "https://docs.google.com/spreadsheets/d/e/2PACX-1vSg2rhuWbyxU6gWk79L54s3CoBLWuDUgrhxkaBZ2fnzOzdMEE48iuHff3O9z1NZBOiYR8f8dkMHHdnd/pub?gid=1202569298&single=true&output=csv",
      "Void Nightmare": "https://docs.google.com/spreadsheets/d/e/2PACX-1vSg2rhuWbyxU6gWk79L54s3CoBLWuDUgrhxkaBZ2fnzOzdMEE48iuHff3O9z1NZBOiYR8f8dkMHHdnd/pub?gid=288867483&single=true&output=csv",
      "Tower of Disappearance": "https://docs.google.com/spreadsheets/d/e/2PACX-1vSg2rhuWbyxU6gWk79L54s3CoBLWuDUgrhxkaBZ2fnzOzdMEE48iuHff3O9z1NZBOiYR8f8dkMHHdnd/pub?gid=1230006600&single=true&output=csv",
      "Duel 4": "https://docs.google.com/spreadsheets/d/e/2PACX-1vSg2rhuWbyxU6gWk79L54s3CoBLWuDUgrhxkaBZ2fnzOzdMEE48iuHff3O9z1NZBOiYR8f8dkMHHdnd/pub?gid=1725380348&single=true&output=csv",
      "LoJ 500k": "https://docs.google.com/spreadsheets/d/e/2PACX-1vSg2rhuWbyxU6gWk79L54s3CoBLWuDUgrhxkaBZ2fnzOzdMEE48iuHff3O9z1NZBOiYR8f8dkMHHdnd/pub?gid=657484618&single=true&output=csv",
      "LoJ Unlimited": "https://docs.google.com/spreadsheets/d/e/2PACX-1vSg2rhuWbyxU6gWk79L54s3CoBLWuDUgrhxkaBZ2fnzOzdMEE48iuHff3O9z1NZBOiYR8f8dkMHHdnd/pub?gid=1478193332&single=true&output=csv"
    };

    const GENERAL_RULES = [
      "No pot, no quote runs",
      "Glitches like bubble skip in V1 are valid until KOG fixes them, as they're only tournament banned",
      "Please show all the stats displayed in the scoreboard or type them in the video description so I can analyze the data",
      "Runs that doesn't use event temporary equipment & coordi, and neither surpass 20% buff cap from GC clubs, Lisnar Blessing and Guild Attack Pot are automatically valid. In other words, the stats are uncapped with permanent items while having 20% buff or below."
      "In case you don't have any GC clubs, guild attack pot is allowed. If you use guild pot while having single GC club, use 5% = 27% cdmg and check in the cap below if your run is valid.",
      "For stick coordi, turtle shell, and other temporary items' extra stats compared to perma BIS, use 555atk = 6,37%MPr conversion rate and add the resulting attack in your atk+spa. If it surpasses 8.2, the run is invalid.",
      "Cdmg caps: 1090% for crit chance build, 1105% for cdmg build. Veigas can keep his +30% cdmg passive without any issues (add +30% cdmg to the cap). Unless proven you can get higher cdmg naturally, surpassing these gaps makes your run invalid."
    ];

    const DUNGEON_RULES = {
      "Tower of Disappearance": [
        "In ToD, Lisnar Blessing is banned if you already have GC Club or PGC (20% buff cap)"
      ],
      "LoJ 500k": [
        "In LoJ, Lisnar Blessing is banned if you already have GC Club or PGC (20% buff cap)"
      ],
      "LoJ Unlimited": [
        "In LoJ, Lisnar Blessing is banned if you already have GC Club or PGC (20% buff cap)"
      ]
    };

    const TIER_ORDER = ["SS","S","A","B","C","D","F","N/A"];
    const dungeonOrder = Object.keys(DUNGEONS);

    let state = {
      active: "Void Invasion",
      view: "leaderboard",
      data: {},
      selected: null,
      loadingDungeon: false,
      loadingTabs: new Set(),
      tierActive: "Overall",
      overallIncludeNA: false,
      overallIncludedDungeons: Object.fromEntries(dungeonOrder.map(d => [d, true]))
    };

    const titleEl = document.getElementById("title");
    const headerMetaEl = document.getElementById("headerMeta");
    const contentAreaEl = document.getElementById("contentArea");
    const videoTitleEl = document.getElementById("videoTitle");
    const videoSubtitleEl = document.getElementById("videoSubtitle");
    const videoCardEl = document.getElementById("videoCard");
    const videoAreaEl = document.getElementById("videoArea");
    const videoActionsEl = document.getElementById("videoActions");
    const youtubeButtonEl = document.getElementById("youtubeButton");
    const copyButtonEl = document.getElementById("copyButton");
    const videoExtraEl = document.getElementById("videoExtra");
    const viewLeaderboardEl = document.getElementById("viewLeaderboard");
    const viewTierEl = document.getElementById("viewTier");
    const rulesSubtitleEl = document.getElementById("rulesSubtitle");
    const rulesAreaEl = document.getElementById("rulesArea");
    let lastRefreshText = "";

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\\"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function parseCSV(text) {
      const lines = text.replace(/\r/g, "").split("\n").filter(Boolean);
      const headerIndex = lines.findIndex(line =>
        line.toLowerCase().includes("position") &&
        line.toLowerCase().includes("character")
      );
      if (headerIndex === -1) return [];

      const header = parseDelimitedLine(lines[headerIndex], ",");
      return lines.slice(headerIndex + 1).map(line => {
        const values = parseDelimitedLine(line, ",");
        const row = {};
        header.forEach((h, i) => row[h] = (values[i] ?? "").trim());
        return row;
      });
    }

    function parseDelimitedLine(line, delimiter) {
      const values = [];
      let current = "";
      let inQuotes = false;

      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        const next = line[i + 1];

        if (char === '"') {
          if (inQuotes && next === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === delimiter && !inQuotes) {
          values.push(current.trim());
          current = "";
        } else {
          current += char;
        }
      }

      values.push(current.trim());
      return values;
    }

    function toSec(t) {
      const parts = String(t || "").split(":").map(Number);
      if (parts.length === 2 && !parts.some(Number.isNaN)) return parts[0] * 60 + parts[1];
      if (parts.length === 3 && !parts.some(Number.isNaN)) return parts[0] * 3600 + parts[1] * 60 + parts[2];
      return Infinity;
    }

    function formatSec(sec) {
      const total = Math.round(sec);
      const mm = Math.floor(total / 60);
      const ss = String(total % 60).padStart(2, "0");
      return `${mm}:${ss}`;
    }

    function normalizeCharacterName(raw) {
      return String(raw || "").replace(/^\d+\)\s*/, "").trim();
    }

    function iconFileFromCharacter(raw) {
      return normalizeCharacterName(raw)
        .toLowerCase()
        .replace(/\//g, "-")
        .replace(/\s+/g, "-")
        .replace(/[^a-z0-9-]/g, "") + ".jpg";
    }

    function enrichRows(rows) {
      return rows
        .filter(r => r.Player && r.Time && r.Character && r.Position && r["Speedrun video:"])
        .map(r => ({
          ...r,
          char: normalizeCharacterName(r.Character),
          iconFile: iconFileFromCharacter(r.Character),
          sec: toSec(r.Time)
        }))
        .sort((a, b) =>
          a.sec - b.sec ||
          parseInt(a.Position, 10) - parseInt(b.Position, 10) ||
          a.char.localeCompare(b.char)
        );
    }

    function yt(url) {
      try {
        const parsed = new URL(url);
        if (parsed.hostname.includes("youtu.be")) {
          return `https://www.youtube.com/embed/${parsed.pathname.replace("/", "").trim()}`;
        }
        if (parsed.hostname.includes("youtube.com")) {
          const id = parsed.searchParams.get("v");
          return id ? `https://www.youtube.com/embed/${id}` : "";
        }
      } catch (e) {}
      return "";
    }

    function makeRowKey(row) {
      return [row.Position, row.char, row.Player, row.Time, row["Post date (dd/mm/yyyy)"] || ""].join("|");
    }

    function selectRow(row, dungeon = state.active) {
      state.selected = row ? { dungeon, rowKey: makeRowKey(row), row } : null;
      render();
      renderVideo();
    }

    function scoreFloor50(raw) {
      const clamped = Math.max(0, Math.min(1, raw));
      return 0.5 + (clamped * 0.5);
    }

    function tierFromScore(s) {
      const pct = s * 100;
      if (pct >= 95) return "SS";
      if (pct >= 90) return "S";
      if (pct >= 85) return "A";
      if (pct >= 75) return "B";
      if (pct >= 70) return "C";
      if (pct >= 60) return "D";
      return "F";
    }

    function getTierThresholdLabel(tier) {
      if (tier === "SS") return "95-100";
      if (tier === "S") return "90-95";
      if (tier === "A") return "85-90";
      if (tier === "B") return "75-85";
      if (tier === "C") return "70-75";
      if (tier === "D") return "60-70";
      if (tier === "F") return "<60";
      return "N/A";
    }

    function shortDungeonName(d) {
      if (d === "Void Invasion") return "V1";
      if (d === "Void Taint") return "V2";
      if (d === "Void Nightmare") return "V3";
      if (d === "Tower of Disappearance") return "ToD";
      if (d === "Duel 4") return "D4";
      if (d === "LoJ 500k") return "LoJ";
      if (d === "LoJ Unlimited") return "LoJ";
      return d;
    }

    function getEnabledOverallDungeons() {
      return dungeonOrder.filter(d => state.overallIncludedDungeons[d]);
    }

    function allCharacters() {
      const set = new Map();
      dungeonOrder.forEach(d => {
        (state.data[d] || []).forEach(r => {
          if (!set.has(r.char)) set.set(r.char, { char: r.char, iconFile: r.iconFile });
        });
      });
      return [...set.values()].sort((a,b) => a.char.localeCompare(b.char));
    }

    function renderViewTabs() {
      viewLeaderboardEl.className = "view-tab" + (state.view === "leaderboard" ? " active" : "");
      viewTierEl.className = "view-tab" + (state.view === "tier" ? " active" : "");
    }

    function renderDungeonTabs() {
      return `
        <div class="tabs">
          ${dungeonOrder.map(d => `
            <button type="button" class="tab ${state.active === d ? "active" : ""}${state.loadingTabs.has(d) ? " loading" : ""}" data-dungeon="${escapeHtml(d)}">
              <span>${escapeHtml(d)}</span>
              <span class="tab-spinner"></span>
            </button>
          `).join("")}
        </div>
      `;
    }

    function bindDungeonTabs() {
      contentAreaEl.querySelectorAll(".tab[data-dungeon]").forEach(el => {
        el.addEventListener("click", async () => {
          const dungeon = el.getAttribute("data-dungeon");
          state.active = dungeon;
          state.selected = null;

          if (!state.data[dungeon]) {
            state.loadingDungeon = true;
            state.loadingTabs.add(dungeon);
            render();
            renderVideo();
            await loadDungeon(dungeon);
            state.loadingTabs.delete(dungeon);
            state.loadingDungeon = false;
          }

          render();
          renderVideo();
        });
      });
    }

    function renderRules() {
      const dungeon = state.view === "leaderboard"
        ? state.active
        : (state.tierActive && state.tierActive !== "Overall" ? state.tierActive : state.active);

      const dungeonSpecificRules = DUNGEON_RULES[dungeon] || [];
      const allRules = [...GENERAL_RULES, ...dungeonSpecificRules];

      rulesSubtitleEl.textContent = dungeonSpecificRules.length
        ? `${dungeon} rules`
        : "General rules for all dungeons";

      rulesAreaEl.innerHTML = `
        <ul class="rules-list">
          ${allRules.map(rule => `<li>${escapeHtml(rule)}</li>`).join("")}
        </ul>
      `;
    }

    function renderTopThree(rows) {
      const top = rows.slice(0, 3);
      if (!top.length) return "";
      const classes = ["first","second","third"];

      return `
        <div class="top-three">
          ${top.map((r, i) => `
            <div class="top-card ${classes[i]}" data-row-key="${escapeHtml(makeRowKey(r))}">
              <div class="top-rank">Top ${i + 1}</div>
              <div class="top-main">
                <img class="top-icon" src="${escapeHtml(r.iconFile)}" alt="${escapeHtml(r.char)}" onerror="this.style.display='none'">
                <div>
                  <div class="top-character">${escapeHtml(r.char)}</div>
                  <div class="top-player">${escapeHtml(r.Player)}</div>
                </div>
              </div>
              <div class="top-time">${escapeHtml(r.Time)}</div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function bindTopThree(rows) {
      contentAreaEl.querySelectorAll(".top-card").forEach(el => {
        el.addEventListener("click", () => {
          const key = el.getAttribute("data-row-key");
          const row = rows.find(r => makeRowKey(r) === key);
          if (row) selectRow(row, state.active);
        });
      });
    }

    function renderSideTimeline(rows) {
      if (!rows || !rows.length) return "";

      const minSec = rows[0].sec;
      const maxSec = rows[rows.length - 1].sec;
      const range = Math.max(maxSec - minSec, 1);

      const usableHeight = Math.max(420, (rows.length - 1) * 56);
      const totalHeight = usableHeight + 90;

      const proximity = usableHeight < 520 ? 30 : 36;
      const laneOffsets = [0, -18, 18, -34, 34, -50, 50];
      const placed = [];

      const nodes = rows.map(row => {
        const pct = rows.length === 1 ? 0 : ((row.sec - minSec) / range) * 100;
        const top = 54 + (pct / 100) * usableHeight;

        let lane = 0;
        while (placed.some(p => Math.abs(p.top - top) < proximity && p.lane === lane)) {
          lane++;
        }

        placed.push({ top, lane });

        return {
          row,
          top,
          left: 76 + (laneOffsets[lane] ?? ((lane % 2 === 0 ? 1 : -1) * (18 + Math.floor(lane / 2) * 16)))
        };
      });

      const markerCount = Math.min(8, Math.max(4, rows.length));
      const markers = Array.from({ length: markerCount }, (_, i) => {
        const pct = markerCount === 1 ? 0 : i / (markerCount - 1);
        const sec = minSec + (range * pct);
        return {
          label: formatSec(sec),
          top: 54 + pct * usableHeight
        };
      });

      return `
        <div class="side-timeline" style="min-height:${totalHeight}px;">
          <div class="timeline-preview" id="timelinePreview"></div>
          <div class="side-timeline-line" style="top:54px;height:${usableHeight}px;"></div>

          ${markers.map(marker => `
            <div class="side-timeline-marker" style="top:${marker.top}px;">
              <span class="side-timeline-marker-label">${escapeHtml(marker.label)}</span>
              <span class="side-timeline-marker-tick"></span>
            </div>
          `).join("")}

          ${nodes.map(node => `
            <div
              class="side-timeline-node ${state.selected && state.selected.dungeon === state.active && state.selected.rowKey === makeRowKey(node.row) ? "active" : ""}"
              data-row-key="${escapeHtml(makeRowKey(node.row))}"
              style="top:${node.top}px; left:${node.left}px;"
            >
              <img src="${escapeHtml(node.row.iconFile)}" alt="${escapeHtml(node.row.char)}" onerror="this.parentElement.style.display='none'">
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderLeaderboardView() {
      const rows = state.data[state.active] || [];
      titleEl.textContent = state.active;
      headerMetaEl.textContent = `${rows.length} total${lastRefreshText ? ` • ${lastRefreshText}` : ""}`;

      if (state.loadingDungeon && !rows.length) {
        contentAreaEl.innerHTML = `
          ${renderDungeonTabs()}
          <div class="loading-shell">
            ${Array.from({ length: 8 }).map(() => `
              <div class="skeleton-row">
                <div class="skeleton-block"></div>
                <div class="skeleton-block"></div>
                <div class="skeleton-block"></div>
                <div class="skeleton-block"></div>
                <div class="skeleton-block"></div>
                <div class="skeleton-block"></div>
              </div>
            `).join("")}
          </div>
        `;
        bindDungeonTabs();
        return;
      }

      if (!rows.length) {
        contentAreaEl.innerHTML = `${renderDungeonTabs()}<div class="empty">No runs found for ${escapeHtml(state.active)}.</div>`;
        bindDungeonTabs();
        return;
      }

      const firstSec = rows[0].sec;

      contentAreaEl.innerHTML = `
        ${renderTopThree(rows)}
        ${renderDungeonTabs()}
        <div class="leaderboard-with-timeline">
          ${renderSideTimeline(rows)}
          <div class="table-wrap">
            <table>
              <colgroup>
                <col class="col-pos"><col class="col-character"><col class="col-player"><col class="col-time"><col class="col-date"><col class="col-gap">
              </colgroup>
              <thead>
                <tr><th>Pos</th><th>Character</th><th>Player</th><th>Time</th><th>Date</th><th>Gap</th></tr>
              </thead>
              <tbody>
                ${rows.map(r => {
                  const activeClass = state.selected && state.selected.dungeon === state.active && state.selected.rowKey === makeRowKey(r) ? "active-row" : "";
                  const rankClass = r.Position === "1" ? "rank rank-1" : r.Position === "2" ? "rank rank-2" : r.Position === "3" ? "rank rank-3" : "rank";
                  const diff = r.sec - firstSec;
                  return `
                    <tr class="${activeClass}" data-row-key="${escapeHtml(makeRowKey(r))}">
                      <td class="${rankClass}">${escapeHtml(r.Position)}</td>
                      <td>
                        <div class="character-cell">
                          <img class="character-icon" src="${escapeHtml(r.iconFile)}" alt="${escapeHtml(r.char)}" onerror="this.style.display='none'">
                          <span class="character-name">${escapeHtml(r.char)}</span>
                        </div>
                      </td>
                      <td><span class="player-name">${escapeHtml(r.Player)}</span></td>
                      <td>${escapeHtml(r.Time)}</td>
                      <td>${escapeHtml(r["Post date (dd/mm/yyyy)"] || "")}</td>
                      <td class="${diff === 0 ? "delta neutral" : "delta good"}">${diff === 0 ? "—" : `+${diff.toFixed(2)}s`}</td>
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          </div>
        </div>
      `;

      bindDungeonTabs();
      bindTopThree(rows);

      const preview = document.getElementById("timelinePreview");

      contentAreaEl.querySelectorAll(".side-timeline-node").forEach(el => {
        const key = el.getAttribute("data-row-key");
        const row = rows.find(r => makeRowKey(r) === key);

        el.addEventListener("mouseenter", () => {
          if (!row || !preview) return;
          preview.innerHTML = `
            <img src="${row.iconFile}" alt="${escapeHtml(row.char)}" onerror="this.parentElement.style.display='none'">
            <div class="timeline-preview-meta">
              <div class="timeline-preview-name">${escapeHtml(row.char)}</div>
              <div class="timeline-preview-time">${escapeHtml(row.Time)}</div>
            </div>
          `;
          preview.classList.add("show");
        });

        el.addEventListener("mouseleave", () => {
          if (!preview) return;
          preview.classList.remove("show");
        });

        el.addEventListener("click", () => {
          if (row) selectRow(row, state.active);
        });
      });

      contentAreaEl.querySelectorAll("tbody tr").forEach(el => {
        el.addEventListener("click", () => {
          const key = el.getAttribute("data-row-key");
          const row = rows.find(r => makeRowKey(r) === key);
          if (row) selectRow(row, state.active);
        });
      });
    }

    function buildDungeonTierData(dungeon) {
      const rows = state.data[dungeon] || [];
      const groups = Object.fromEntries(TIER_ORDER.map(t => [t, []]));
      const characters = allCharacters();
      const rowMap = new Map(rows.map(r => [r.char, r]));

      if (!rows.length) {
        characters.forEach(c => groups["N/A"].push({ ...c, dungeon }));
        return groups;
      }

      const best = rows[0].sec;
      const worst = Math.max(...rows.map(r => r.sec));
      const range = Math.max(worst - best, 1);

      characters.forEach(c => {
        const row = rowMap.get(c.char);
        if (!row) {
          groups["N/A"].push({ ...c, dungeon });
          return;
        }

        const rawScore = 1 - ((row.sec - best) / range);
        const score = scoreFloor50(rawScore);
        const tier = tierFromScore(score);

        groups[tier].push({ ...row, score, tier, dungeon });
      });

      return groups;
    }

    function buildOverallTierData() {
      const byCharacter = new Map();
      const characters = allCharacters();
      const enabledDungeons = getEnabledOverallDungeons();
      const enabledCount = enabledDungeons.length;

      const groups = Object.fromEntries(TIER_ORDER.map(t => [t, []]));
      if (!enabledCount) return groups;

      enabledDungeons.forEach(dungeon => {
        const rows = state.data[dungeon] || [];
        const fieldSize = rows.length;
        if (!fieldSize) return;

        const denom = Math.max(fieldSize - 1, 1);
        const rowMap = new Map(rows.map(r => [r.char, r]));

        characters.forEach(charObj => {
          const char = charObj.char;
          const row = rowMap.get(char);

          if (!byCharacter.has(char)) {
            byCharacter.set(char, {
              char,
              iconFile: charObj.iconFile,
              total: 0,
              bestScore: -1,
              bestRow: null,
              bestDungeon: "",
              dungeonRanks: {},
              hasMissingEnabledDungeon: false
            });
          }

          const item = byCharacter.get(char);

          if (!row) {
            item.hasMissingEnabledDungeon = true;
            item.dungeonRanks[dungeon] = "-";

            if (state.overallIncludeNA) {
              const rank = fieldSize + 1;
              const rawScore = 1 - ((rank - 1) / denom);
              const score = scoreFloor50(rawScore);
              item.total += score;
            }
            return;
          }

          const rank = parseInt(row.Position, 10);
          const rawScore = 1 - ((rank - 1) / denom);
          const score = scoreFloor50(rawScore);

          item.total += score;
          item.dungeonRanks[dungeon] = row.Position;

          if (score > item.bestScore) {
            item.bestScore = score;
            item.bestRow = row;
            item.bestDungeon = dungeon;
          }
        });
      });

      byCharacter.forEach(item => {
        enabledDungeons.forEach(d => {
          if (!(d in item.dungeonRanks)) {
            item.hasMissingEnabledDungeon = true;
            item.dungeonRanks[d] = "-";
          }
        });

        if (!state.overallIncludeNA && item.hasMissingEnabledDungeon) {
          groups["N/A"].push({
            ...item,
            score: null
          });
          return;
        }

        const finalScore = item.total / enabledCount;
        const tier = tierFromScore(finalScore);

        groups[tier].push({
          ...item,
          score: finalScore,
          tier
        });
      });

      return groups;
    }

    function renderOverallControls() {
      const enabled = getEnabledOverallDungeons();

      return `
        <div class="overall-controls">
          <div class="overall-controls-group">
            <span class="overall-controls-label">Include dungeons:</span>
            ${dungeonOrder.map(d => `
              <button type="button" class="mini-toggle ${state.overallIncludedDungeons[d] ? "active" : "off"}" data-overall-dungeon="${escapeHtml(d)}">
                ${escapeHtml(shortDungeonName(d))}
              </button>
            `).join("")}
          </div>
          <div class="overall-controls-group">
            <span class="overall-controls-label">Missing runs:</span>
            <button type="button" class="mini-toggle ${state.overallIncludeNA ? "active" : "off"}" data-overall-na-toggle="1">
              ${state.overallIncludeNA ? "Include in score" : "Move to N/A"}
            </button>
            <span class="overall-controls-label">${enabled.length ? `${enabled.length} dungeon${enabled.length === 1 ? "" : "s"} active` : "No dungeons active"}</span>
          </div>
        </div>
      `;
    }

    function bindOverallControls() {
      contentAreaEl.querySelectorAll("[data-overall-dungeon]").forEach(el => {
        el.addEventListener("click", () => {
          const dungeon = el.getAttribute("data-overall-dungeon");
          const next = !state.overallIncludedDungeons[dungeon];
          const currentlyEnabled = getEnabledOverallDungeons().length;
          if (!next && currentlyEnabled === 1) return;
          state.overallIncludedDungeons[dungeon] = next;
          renderTierView();
        });
      });

      contentAreaEl.querySelector("[data-overall-na-toggle]")?.addEventListener("click", () => {
        state.overallIncludeNA = !state.overallIncludeNA;
        renderTierView();
      });
    }

    function renderTierGroups(groups, overall = false) {
      const enabledOverallDungeons = getEnabledOverallDungeons();

      return TIER_ORDER.map(tier => {
        let items = groups[tier] || [];

        items = items.slice().sort((a, b) => {
          if (tier === "N/A") return a.char.localeCompare(b.char);
          if (overall) return (b.score - a.score) || a.char.localeCompare(b.char);
          return (a.sec - b.sec) || a.char.localeCompare(b.char);
        });

        const cls = tier === "N/A" ? "NA" : tier;

        return `
          <div class="tier-group">
            <div class="tier-header">
              <div class="tier-label tier-${cls}">${tier}</div>
              <div class="tier-cards">
                ${items.length ? items.map(item => {
                  let sub = "";
                  let scoreText = "";

                  if (tier === "N/A") {
                    sub = overall
                      ? `<div class="rank-grid">${enabledOverallDungeons.map(d => `<span>${shortDungeonName(d)} (${item.dungeonRanks?.[d] ? "#" + item.dungeonRanks[d] : "-"})</span>`).join("")}</div>`
                      : "No run";
                    scoreText = "No tracked run";
                  } else if (overall) {
                    sub = `
                      <div class="rank-grid">
                        ${enabledOverallDungeons.map(d => `<span>${shortDungeonName(d)} (${item.dungeonRanks[d] ? "#" + item.dungeonRanks[d] : "-"})</span>`).join("")}
                      </div>
                    `;
                    scoreText = `Score ${(item.score * 100).toFixed(1)} • Rank ${item.tier} (${getTierThresholdLabel(item.tier)})`;
                  } else {
                    sub = item.Time || "";
                    scoreText = `Score ${(item.score * 100).toFixed(1)} • Rank ${item.tier} (${getTierThresholdLabel(item.tier)})`;
                  }

                  return `
                    <div class="tier-card"
                      data-char="${escapeHtml(item.char)}"
                      data-dungeon="${escapeHtml(overall ? item.bestDungeon || "" : (item.dungeon || ""))}"
                      data-na="${tier === "N/A" ? "1" : "0"}"
                      data-overall="${overall ? "1" : "0"}">
                      <div class="tier-card-main">
                        <img class="tier-icon" src="${escapeHtml(item.iconFile || "")}" alt="${escapeHtml(item.char)}" onerror="this.style.display='none'">
                        <div class="tier-card-text">
                          <div class="tier-card-name">${escapeHtml(item.char)}</div>
                          <div class="tier-card-sub">${overall ? sub : escapeHtml(sub)}</div>
                        </div>
                      </div>
                      <div class="tier-card-score">${escapeHtml(scoreText)}</div>
                    </div>
                  `;
                }).join("") : `<div class="tier-note">No characters in this tier.</div>`}
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    function bindTierClicks() {
      contentAreaEl.querySelectorAll(".tier-card").forEach(el => {
        el.addEventListener("click", () => {
          const character = el.dataset.char;
          const dungeon = el.dataset.dungeon;
          const isOverall = el.dataset.overall === "1";

          if (isOverall) {
            renderOverallCharacterVideos(character);
            return;
          }

          if (el.dataset.na === "1") return;
          if (!dungeon) return;
          const row = (state.data[dungeon] || []).find(r => r.char === character);
          if (row) selectRow(row, dungeon);
        });
      });
    }

    function renderTierView() {
      titleEl.textContent = "Tier Lists";
      headerMetaEl.textContent = `Overall uses selected dungeons only. Missing runs can either move a character to N/A or stay included in scoring.${lastRefreshText ? ` • ${lastRefreshText}` : ""}`;

      const tierTabs = ["Overall", ...dungeonOrder];
      const activeTier = state.tierActive || "Overall";

      let bodyHtml = "";
      if (activeTier === "Overall") {
        const overallGroups = buildOverallTierData();
        bodyHtml = `
          ${renderOverallControls()}
          ${renderTierGroups(overallGroups, true)}
        `;
      } else {
        bodyHtml = renderTierGroups(buildDungeonTierData(activeTier), false);
      }

      contentAreaEl.innerHTML = `
        <div class="tier-wrap">
          <div class="tabs">
            ${tierTabs.map(t => `
              <button type="button" class="tab ${activeTier === t ? "active" : ""}" data-tier-tab="${escapeHtml(t)}">${escapeHtml(t)}</button>
            `).join("")}
          </div>
          ${bodyHtml}
        </div>
      `;

      contentAreaEl.querySelectorAll("[data-tier-tab]").forEach(el => {
        el.addEventListener("click", () => {
          state.tierActive = el.getAttribute("data-tier-tab");
          renderTierView();
        });
      });

      if (activeTier === "Overall") bindOverallControls();
      bindTierClicks();
    }

    function renderOverallCharacterVideos(character) {
      const sections = getEnabledOverallDungeons().map(dungeon => {
        const row = (state.data[dungeon] || []).find(r => r.char === character);

        if (!row) {
          return `
            <div class="multi-video-block">
              <h3>${escapeHtml(dungeon)}</h3>
              <div class="multi-video-empty">No run</div>
            </div>
          `;
        }

        const embed = yt(row["Speedrun video:"]);
        return `
          <div class="multi-video-block">
            <h3>${escapeHtml(dungeon)}</h3>
            <div class="multi-video-meta">
              ${escapeHtml(row.char)} • ${escapeHtml(row.Player)} • ${escapeHtml(row.Time)} • #${escapeHtml(row.Position)}
            </div>
            ${
              embed
                ? `<iframe class="multi-video-frame" src="${escapeHtml(embed)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`
                : `<div class="multi-video-empty">Invalid or missing YouTube link</div>`
            }
          </div>
        `;
      }).join("");

      videoTitleEl.textContent = `${character} • Overall`;
      videoSubtitleEl.textContent = `Runs for currently enabled overall dungeons`;
      videoCardEl.innerHTML = "";
      videoAreaEl.className = "";
      videoAreaEl.innerHTML = `<div class="multi-video-wrap">${sections || '<div class="multi-video-empty">No enabled dungeons.</div>'}</div>`;
      videoActionsEl.style.display = "none";
      videoExtraEl.innerHTML = "";
    }

    function render() {
      renderViewTabs();
      renderRules();
      if (state.view === "leaderboard") renderLeaderboardView();
      else renderTierView();
    }

    function renderVideo() {
      if (state.loadingDungeon && !state.selected) {
        videoTitleEl.textContent = "Loading runs...";
        videoSubtitleEl.textContent = "Fetching leaderboard data from the sheet.";
        videoCardEl.innerHTML = "";
        videoAreaEl.className = "";
        videoAreaEl.innerHTML = `<div class="video-loading"><div class="video-skeleton"></div></div>`;
        videoActionsEl.style.display = "none";
        videoExtraEl.innerHTML = "";
        return;
      }

      if (!state.selected || !state.selected.row) {
        videoTitleEl.textContent = "Select a run";
        videoSubtitleEl.textContent = "Choose any leaderboard row, timeline icon, or tier card to embed the video here.";
        videoCardEl.innerHTML = "";
        videoAreaEl.className = "placeholder";
        videoAreaEl.innerHTML = "No video selected";
        videoActionsEl.style.display = "none";
        videoExtraEl.innerHTML = "";
        return;
      }

      const row = state.selected.row;
      const embed = yt(row["Speedrun video:"]);

      videoTitleEl.textContent = `${row.Player} • ${row.char}`;
      videoSubtitleEl.textContent = `${state.selected.dungeon} • ${row.Time} • ${row["Post date (dd/mm/yyyy)"] || ""}`;

      videoCardEl.innerHTML = `
        <div class="video-card">
          <div class="video-card-main">
            <img class="video-card-icon" src="${escapeHtml(row.iconFile)}" alt="${escapeHtml(row.char)}" onerror="this.style.display='none'">
            <div class="video-card-text">
              <div>${escapeHtml(row.char)}</div>
              <div class="video-card-player">${escapeHtml(row.Player)}</div>
            </div>
          </div>
          <div class="video-card-sub">Position ${escapeHtml(row.Position)} • ${escapeHtml(row.Time)}</div>
        </div>
      `;

      if (!embed) {
        videoAreaEl.className = "placeholder";
        videoAreaEl.innerHTML = "Invalid or missing YouTube link";
        videoActionsEl.style.display = "none";
        videoExtraEl.innerHTML = "";
        return;
      }

      videoAreaEl.className = "";
      videoAreaEl.innerHTML = `<div class="video-frame-wrap"><iframe class="video-frame" src="${escapeHtml(embed)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>`;
      youtubeButtonEl.href = row["Speedrun video:"];
      videoActionsEl.style.display = "flex";
      videoExtraEl.innerHTML = `Submitted on ${escapeHtml(row["Post date (dd/mm/yyyy)"] || "")}.`;
    }

    async function loadDungeon(dungeon) {
      try {
        const response = await fetch(DUNGEONS[dungeon], { cache: "no-store" });
        if (!response.ok) {
          state.data[dungeon] = [];
          return;
        }
        const text = await response.text();
        state.data[dungeon] = enrichRows(parseCSV(text));
      } catch (e) {
        state.data[dungeon] = [];
      }
    }

    function preloadRemainingDungeons() {
      dungeonOrder
        .filter(d => d !== state.active && !state.data[d])
        .forEach(async d => {
          state.loadingTabs.add(d);
          render();
          await loadDungeon(d);
          state.loadingTabs.delete(d);
          render();
        });
    }

    async function load() {
      state.loadingDungeon = true;
      render();
      renderVideo();
      await loadDungeon(state.active);
      state.loadingDungeon = false;
      lastRefreshText = `updated ${new Date().toLocaleString()}`;
      render();
      renderVideo();
      preloadRemainingDungeons();
    }

    viewLeaderboardEl.addEventListener("click", () => {
      state.view = "leaderboard";
      render();
    });

    viewTierEl.addEventListener("click", async () => {
      state.view = "tier";
      state.tierActive = state.tierActive || "Overall";
      const missing = dungeonOrder.filter(d => !state.data[d]);
      for (const dungeon of missing) {
        state.loadingTabs.add(dungeon);
        render();
        await loadDungeon(dungeon);
        state.loadingTabs.delete(dungeon);
      }
      render();
    });

    copyButtonEl.addEventListener("click", async () => {
      if (!state.selected || !state.selected.row) return;
      try {
        await navigator.clipboard.writeText(state.selected.row["Speedrun video:"] || "");
        copyButtonEl.textContent = "Copied";
        setTimeout(() => copyButtonEl.textContent = "Copy video link", 1200);
      } catch (e) {
        copyButtonEl.textContent = "Copy failed";
        setTimeout(() => copyButtonEl.textContent = "Copy video link", 1200);
      }
    });

    render();
    load();
  </script>
</body>
</html>
