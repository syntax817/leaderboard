<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speedrun Leaderboards</title>

  <style>
    :root {
      --red: #ff3b3b;
      --orange: #ff7a18;
      --purple: #7c3aed;
      --dark: #0b0f1a;
      --panel: rgba(10, 15, 30, 0.86);
      --border: rgba(255,255,255,0.15);
      --text: #f5f7ff;
      --muted: #9aa6c0;
      --gold: #ffd700;
      --silver: #c0c0c0;
      --bronze: #cd7f32;
      --badge: rgba(255,255,255,0.08);
      --wr: #ffcc4d;
      --record: #7ee787;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.85)),
        url('background.jpg') center / cover no-repeat fixed;
    }

    .container {
      width: min(1500px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 40px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 42px;
      background: linear-gradient(90deg, var(--red), var(--orange));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 20px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(760px, 1.25fr) minmax(560px, 1fr);
      gap: 20px;
      align-items: start;
    }

    .panel,
    .video-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      backdrop-filter: blur(6px);
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0,0,0,0.28);
    }

    .panel-header,
    .video-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .header-title {
      font-size: 24px;
      font-weight: 700;
    }

    .header-meta {
      color: var(--muted);
      font-size: 14px;
      margin-top: 4px;
    }

    .controls {
      display: flex;
      gap: 10px;
      padding: 0 16px 14px;
      flex-wrap: wrap;
    }

    .filter-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 220px;
    }

    .filter-box label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    select {
      background: rgba(255,255,255,0.05);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      outline: none;
    }

    .tabs {
      display: flex;
      gap: 10px;
      padding: 10px 16px;
      flex-wrap: wrap;
    }

    .tab {
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      cursor: pointer;
      font-weight: bold;
      transition: 0.15s ease;
    }

    .tab:hover {
      transform: translateY(-1px);
      border-color: rgba(255,255,255,0.28);
    }

    .tab.active {
      background: linear-gradient(135deg, var(--red), var(--purple));
      border: none;
    }

    .table-wrap {
      padding: 0 12px 12px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 980px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    col.col-pos { width: 90px; }
    col.col-character { width: 320px; }
    col.col-player { width: 220px; }
    col.col-time { width: 130px; }
    col.col-date { width: 160px; }
    col.col-badges { width: 180px; }

    th, td {
      padding: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      vertical-align: middle;
    }

    th {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      text-align: left;
      white-space: nowrap;
    }

    td {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    tbody tr {
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    tbody tr:hover td {
      background: rgba(255,255,255,0.06);
    }

    tbody tr.active-row td {
      background: rgba(124, 58, 237, 0.18);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.03), inset 0 -1px 0 rgba(255,255,255,0.03);
    }

    .rank {
      font-weight: 800;
    }

    .rank.rank-1 { color: var(--gold); }
    .rank.rank-2 { color: var(--silver); }
    .rank.rank-3 { color: var(--bronze); }

    .character-cell {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .character-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.05);
      flex: 0 0 auto;
    }

    .character-name {
      font-weight: 700;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-name {
      color: var(--orange);
      font-weight: 700;
    }

    .badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      white-space: normal;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
      background: var(--badge);
      border: 1px solid rgba(255,255,255,0.10);
    }

    .badge.wr {
      background: rgba(255, 204, 77, 0.12);
      border-color: rgba(255, 204, 77, 0.28);
      color: var(--wr);
    }

    .badge.record {
      background: rgba(126, 231, 135, 0.12);
      border-color: rgba(126, 231, 135, 0.28);
      color: var(--record);
    }

    .video-header-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .video-subtitle {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
    }

    .video-frame-wrap {
      padding: 16px;
    }

    .video-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 420px;
      border: 0;
      background: black;
      display: block;
      border-radius: 12px;
    }

    .video-extra {
      padding: 0 16px 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .video-extra a {
      color: var(--orange);
      text-decoration: none;
      font-weight: 700;
    }

    .video-extra a:hover {
      text-decoration: underline;
    }

    .placeholder {
      padding: 48px 24px;
      text-align: center;
      color: var(--muted);
      min-height: 520px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .empty {
      padding: 18px 16px 22px;
      color: var(--muted);
    }

    @media (max-width: 1200px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .video-frame {
        min-height: 360px;
      }

      .placeholder {
        min-height: 260px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Grand Chase Leaderboards</h1>
    <div class="subtitle">Speedrun rankings • Click any row to watch the run</div>

    <div class="layout">
      <div class="panel">
        <div class="panel-header">
          <div class="header-top">
            <div>
              <div class="header-title" id="title"></div>
              <div class="header-meta" id="headerMeta"></div>
            </div>
          </div>
        </div>

        <div class="tabs" id="tabs"></div>

        <div class="controls">
          <div class="filter-box">
            <label for="characterFilter">Filter character</label>
            <select id="characterFilter">
              <option value="">All Characters</option>
            </select>
          </div>
        </div>

        <div id="table"></div>
      </div>

      <div class="video-panel">
        <div class="video-header">
          <div class="video-header-title" id="videoTitle">Select a run</div>
          <div class="video-subtitle" id="videoSubtitle">Choose any leaderboard row to embed the video here.</div>
        </div>
        <div id="videoArea" class="placeholder">No video selected</div>
        <div class="video-extra" id="videoExtra"></div>
      </div>
    </div>
  </div>

<script>
const DUNGEONS = {
  "Void Invasion": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTdROeXMSm_mkP7vXqzSOt0y5p7kIKOdCJx_XUoJjQ1SC4ycm0gt7QdEn25cagvWRQhITRVxh9YMtj-/pub?gid=1827141351&single=true&output=csv",
  "Void Taint": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTdROeXMSm_mkP7vXqzSOt0y5p7kIKOdCJx_XUoJjQ1SC4ycm0gt7QdEn25cagvWRQhITRVxh9YMtj-/pub?gid=1202569298&single=true&output=csv",
  "Void Nightmare": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTdROeXMSm_mkP7vXqzSOt0y5p7kIKOdCJx_XUoJjQ1SC4ycm0gt7QdEn25cagvWRQhITRVxh9YMtj-/pub?gid=288867483&single=true&output=csv",
  "Tower of Disappearance": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTdROeXMSm_mkP7vXqzSOt0y5p7kIKOdCJx_XUoJjQ1SC4ycm0gt7QdEn25cagvWRQhITRVxh9YMtj-/pub?gid=1230006600&single=true&output=csv"
};

let state = {
  active: Object.keys(DUNGEONS)[0],
  data: {},
  selected: null,
  characterFilter: ""
};

const characterFilterEl = document.getElementById("characterFilter");
const titleEl = document.getElementById("title");
const headerMetaEl = document.getElementById("headerMeta");
const tableEl = document.getElementById("table");
const tabsEl = document.getElementById("tabs");
const videoTitleEl = document.getElementById("videoTitle");
const videoSubtitleEl = document.getElementById("videoSubtitle");
const videoAreaEl = document.getElementById("videoArea");
const videoExtraEl = document.getElementById("videoExtra");
let lastRefreshText = "";

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function parseDelimitedLine(line, delimiter) {
  if (delimiter === "\t") {
    return line.split("\t").map(value => value.trim());
  }

  const values = [];
  let current = "";
  let inQuotes = false;

  for (let i = 0; i < line.length; i++) {
    const char = line[i];
    const next = line[i + 1];

    if (char === '"') {
      if (inQuotes && next === '"') {
        current += '"';
        i++;
      } else {
        inQuotes = !inQuotes;
      }
    } else if (char === delimiter && !inQuotes) {
      values.push(current.trim());
      current = "";
    } else {
      current += char;
    }
  }

  values.push(current.trim());
  return values;
}

function parseSheetData(text) {
  const lines = text
    .replace(/\r/g, "")
    .split("\n")
    .filter(line => line.trim() !== "");

  if (!lines.length) return [];

  // 🔥 find the actual header row (starts with Position)
  const headerIndex = lines.findIndex(line =>
    line.toLowerCase().includes("position") &&
    line.toLowerCase().includes("character")
  );

  if (headerIndex === -1) return [];

  const delimiter = lines[headerIndex].includes("\t") ? "\t" : ",";
  const keys = parseDelimitedLine(lines[headerIndex], delimiter);

  return lines.slice(headerIndex + 1).map(line => {
    const values = parseDelimitedLine(line, delimiter);
    const obj = {};
    keys.forEach((k, i) => {
      obj[k] = (values[i] ?? "").trim();
    });
    return obj;
  });
}

function seconds(t) {
  const parts = String(t || "").split(":").map(Number);
  if (parts.length === 2 && !parts.some(Number.isNaN)) return parts[0] * 60 + parts[1];
  if (parts.length === 3 && !parts.some(Number.isNaN)) return parts[0] * 3600 + parts[1] * 60 + parts[2];
  return Number.POSITIVE_INFINITY;
}

function yt(url) {
  try {
    const parsed = new URL(url);
    if (parsed.hostname.includes("youtu.be")) {
      const id = parsed.pathname.replace("/", "").trim();
      return id ? `https://www.youtube.com/embed/${id}` : "";
    }
    if (parsed.hostname.includes("youtube.com")) {
      const id = parsed.searchParams.get("v");
      return id ? `https://www.youtube.com/embed/${id}` : "";
    }
  } catch (e) {}
  return "";
}

function normalizeCharacterName(rawName) {
  return String(rawName || "").replace(/^\d+\)\s*/, "").trim();
}

function iconFileFromCharacter(rawName) {
  const name = normalizeCharacterName(rawName)
    .toLowerCase()
    .replace(/\//g, "-")
    .replace(/\s+/g, "-")
    .replace(/[^a-z0-9-]/g, "");
  return name ? `${name}.jpg` : "";
}

function positionValue(position) {
  const n = parseInt(position, 10);
  return Number.isFinite(n) ? n : 999999;
}

function enrichRows(rows) {
  const characterBest = {};
  let overallBest = Number.POSITIVE_INFINITY;

  rows.forEach(row => {
    const charName = normalizeCharacterName(row.Character);
    const timeSeconds = seconds(row.Time);
    if (timeSeconds < overallBest) overallBest = timeSeconds;
    if (!(charName in characterBest) || timeSeconds < characterBest[charName]) {
      characterBest[charName] = timeSeconds;
    }
  });

  return rows
    .map(row => {
      const cleanCharacter = normalizeCharacterName(row.Character);
      const timeSeconds = seconds(row.Time);
      return {
        ...row,
        cleanCharacter,
        iconFile: iconFileFromCharacter(row.Character),
        timeSeconds,
        isWorldRecord: timeSeconds === overallBest,
        isCharacterRecord: timeSeconds === characterBest[cleanCharacter]
      };
    })
    .sort((a, b) => {
      const timeDiff = a.timeSeconds - b.timeSeconds;
      if (timeDiff !== 0) return timeDiff;
      const posDiff = positionValue(a.Position) - positionValue(b.Position);
      if (posDiff !== 0) return posDiff;
      return a.cleanCharacter.localeCompare(b.cleanCharacter);
    });
}

function makeRowKey(row) {
  return [
    row.Position,
    row.cleanCharacter,
    row.Player,
    row.Time,
    row["Post date (dd/mm/yyyy)"] || ""
  ].join("|");
}

function getDisplayedRows() {
  const rows = state.data[state.active] || [];
  if (!state.characterFilter) return rows;
  return rows.filter(row => row.cleanCharacter === state.characterFilter);
}

function populateCharacterFilter() {
  const allRows = state.data[state.active] || [];
  const characters = [...new Set(allRows.map(row => row.cleanCharacter))]
    .filter(Boolean)
    .sort((a, b) => a.localeCompare(b));

  characterFilterEl.innerHTML =
    '<option value="">All Characters</option>' +
    characters.map(character => `<option value="${escapeHtml(character)}">${escapeHtml(character)}</option>`).join("");

  if (state.characterFilter && !characters.includes(state.characterFilter)) {
    state.characterFilter = "";
  }

  characterFilterEl.value = state.characterFilter;
}

function renderTabs() {
  tabsEl.innerHTML = "";
  Object.keys(DUNGEONS).forEach(d => {
    const el = document.createElement("div");
    el.className = "tab " + (state.active === d ? "active" : "");
    el.textContent = d;
    el.onclick = () => {
      state.active = d;
      state.selected = null;
      state.characterFilter = "";
      render();
      renderVideo();
    };
    tabsEl.appendChild(el);
  });
}

function render() {
  titleEl.textContent = state.active;
  populateCharacterFilter();

  const allRows = state.data[state.active] || [];
  const rows = getDisplayedRows();

  headerMetaEl.textContent = `${rows.length} shown • ${allRows.length} total${lastRefreshText ? ` • ${lastRefreshText}` : ""}`;

  if (!rows.length) {
    tableEl.innerHTML = `<div class="empty">No runs found for ${escapeHtml(state.active)}.</div>`;
    renderTabs();
    return;
  }

  tableEl.innerHTML = `
    <div class="table-wrap">
      <table>
        <colgroup>
          <col class="col-pos">
          <col class="col-character">
          <col class="col-player">
          <col class="col-time">
          <col class="col-date">
          <col class="col-badges">
        </colgroup>
        <thead>
          <tr>
            <th>Pos</th>
            <th>Character</th>
            <th>Player</th>
            <th>Time</th>
            <th>Date</th>
            <th>Badges</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(r => {
            const activeClass =
              state.selected &&
              state.selected.dungeon === state.active &&
              state.selected.rowKey === makeRowKey(r)
                ? "active-row"
                : "";

            const rankClass =
              r.Position === "1"
                ? "rank rank-1"
                : r.Position === "2"
                ? "rank rank-2"
                : r.Position === "3"
                ? "rank rank-3"
                : "rank";

            const badges = [];
            if (r.isWorldRecord) badges.push('<span class="badge wr">WR</span>');
            if (r.isCharacterRecord) badges.push('<span class="badge record">Character Record</span>');

            return `
              <tr class="${activeClass}" data-row-key="${escapeHtml(makeRowKey(r))}">
                <td class="${rankClass}">${escapeHtml(r.Position)}</td>
                <td>
                  <div class="character-cell">
                    <img
                      class="character-icon"
                      src="${escapeHtml(r.iconFile)}"
                      alt="${escapeHtml(r.cleanCharacter)}"
                      onerror="this.style.display='none'"
                    >
                    <span class="character-name">${escapeHtml(r.cleanCharacter)}</span>
                  </div>
                </td>
                <td><span class="player-name">${escapeHtml(r.Player)}</span></td>
                <td>${escapeHtml(r.Time)}</td>
                <td>${escapeHtml(r["Post date (dd/mm/yyyy)"] || "")}</td>
                <td><div class="badges">${badges.join("")}</div></td>
              </tr>
            `;
          }).join("")}
        </tbody>
      </table>
    </div>
  `;

  tableEl.querySelectorAll("tbody tr").forEach(tr => {
    tr.addEventListener("click", () => {
      const rowKey = tr.getAttribute("data-row-key");
      const row = rows.find(item => makeRowKey(item) === rowKey);
      state.selected = row ? { dungeon: state.active, rowKey, row } : null;
      render();
      renderVideo();
    });
  });

  renderTabs();
}

function renderVideo() {
  if (!state.selected || !state.selected.row) {
    videoTitleEl.textContent = "Select a run";
    videoSubtitleEl.textContent = "Choose any leaderboard row to embed the video here.";
    videoAreaEl.className = "placeholder";
    videoAreaEl.innerHTML = "No video selected";
    videoExtraEl.innerHTML = "";
    return;
  }

  const row = state.selected.row;
  const embed = yt(row["Speedrun video:"]);

  videoTitleEl.textContent = `${row.Player} • ${row.cleanCharacter}`;
  videoSubtitleEl.textContent = `${state.selected.dungeon} • ${row.Time} • ${row["Post date (dd/mm/yyyy)"] || ""}`;

  const badges = [];
  if (row.isWorldRecord) badges.push("WR");
  if (row.isCharacterRecord) badges.push("Character Record");

  if (!embed) {
    videoAreaEl.className = "placeholder";
    videoAreaEl.innerHTML = "Invalid or missing YouTube link";
    videoExtraEl.innerHTML = "";
    return;
  }

  videoAreaEl.className = "";
  videoAreaEl.innerHTML = `
    <div class="video-frame-wrap">
      <iframe
        class="video-frame"
        src="${escapeHtml(embed)}"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen
      ></iframe>
    </div>
  `;

  videoExtraEl.innerHTML = `
    Player: <strong>${escapeHtml(row.Player)}</strong><br>
    Character: <strong>${escapeHtml(row.cleanCharacter)}</strong><br>
    Position: <strong>${escapeHtml(row.Position)}</strong><br>
    ${badges.length ? `Badges: <strong>${escapeHtml(badges.join(" • "))}</strong><br>` : ""}
    <a href="${escapeHtml(row["Speedrun video:"])}" target="_blank" rel="noopener noreferrer">Open on YouTube</a>
  `;
}

characterFilterEl.addEventListener("change", () => {
  state.characterFilter = characterFilterEl.value;

  if (state.selected && state.selected.dungeon === state.active) {
    const visibleRows = getDisplayedRows();
    const stillVisible = visibleRows.some(row => makeRowKey(row) === state.selected.rowKey);
    if (!stillVisible) state.selected = null;
  }

  render();
  renderVideo();
});

async function load() {
  for (const dungeon in DUNGEONS) {
    try {
      const response = await fetch(DUNGEONS[dungeon], { cache: "no-store" });
      if (!response.ok) {
        state.data[dungeon] = [];
        continue;
      }

      const text = await response.text();

      state.data[dungeon] = enrichRows(
        parseSheetData(text).filter(row =>
          row.Player &&
          row.Time &&
          row.Character &&
          row.Position &&
          row["Speedrun video:"]
        )
      );
    } catch (e) {
      state.data[dungeon] = [];
    }
  }

  lastRefreshText = `updated ${new Date().toLocaleString()}`;
  render();
  renderVideo();
}

renderTabs();
load();
</script>
</body>
</html>
